name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Mencegah penumpukan antrean job yang mubazir saat Anda buru-buru melakukan commit berulang
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Codebase
    timeout-minutes: 15 # Keamanan agar tagihan CI tidak membengkak jika terjadi infinite loop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Penting bagi Turborepo untuk membandingkan perubahan kode

      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome
        run: biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # - name: Set up Turborepo Remote Cache
      #   uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
      #   with:
      #     team: ${{ vars.TURBO_TEAM }}
